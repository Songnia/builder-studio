name: Deploy to o2switch

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types: [completed]

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-o2switch
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # --- FRONTEND BUILD ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: https://api.vanda-studio.org/api
          VITE_ADMIN_URL: https://app.vanda-studio.org
          VITE_PUBLIC_DOMAIN: vanda-studio.org
        run: |
          npm run build
          rsync -a --delete dist-public/ ../backend/public/landing/
          rsync -a --delete dist-admin/ ../backend/public/app/

      - name: Validate production bundles
        run: |
          test -f frontend/dist-public/index.html
          test -f frontend/dist-admin/index.html
          test -f frontend/dist-public/.htaccess
          test -f frontend/dist-admin/.htaccess
          test -f backend/public/landing/index.html
          test -f backend/public/app/index.html
          if grep -R "localhost:8000" frontend/dist-public frontend/dist-admin; then
            echo "Production bundles contain a localhost API URL"
            exit 1
          fi
          grep -R -q "api.vanda-studio.org/api" frontend/dist-public/assets frontend/dist-admin/assets

      # --- DEPLOYMENT ---
      - name: Validate Secrets and Deploy
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then echo "❌ SSH_HOST is missing"; exit 1; fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then echo "❌ SSH_USER is missing"; exit 1; fi
          if [ -z "${{ secrets.REMOTE_PATH }}" ]; then echo "❌ REMOTE_PATH is missing"; exit 1; fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then echo "❌ SSH_PRIVATE_KEY is missing"; exit 1; fi
          
          echo "✅ All secrets detected. Starting deployment..."
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key
          chmod 600 private_key
          rsync -avz -e "ssh -i private_key -p 2222 -o StrictHostKeyChecking=no" \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.REMOTE_PATH }}
          rm private_key

      # --- POST-DEPLOYMENT COMMANDS ---
      - name: Post-deployment Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            set -e
            cd ${{ secrets.REMOTE_PATH }}/backend
            php artisan down --retry=60
            trap 'php artisan up' EXIT
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan storage:link || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan up
            trap - EXIT
